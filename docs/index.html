<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIA-UCALDAS - Iniciar Sesión</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

  <!-- Header -->
  <header class="navbar navbar-expand-lg border-bottom bg-white px-3 py-2 shadow-sm">
    <div class="container-fluid max-w-container">
      <div class="d-flex align-items-center gap-2">
        <div class="brand-badge">U</div>
        <div>
          <span class="fw-bold fs-5 text-primary-custom">SIA-UCALDAS</span>
          <small class="d-block text-muted d-none d-sm-block">Universidad de Caldas · Sistema Integrado Académico</small>
        </div>
      </div>
      <button id="themeToggle" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1">
        <i class="bi bi-moon-fill" id="themeIcon"></i>
        <span class="d-none d-sm-inline" id="themeText">Modo Oscuro</span>
      </button>
    </div>
  </header>

  <!-- Login Form Container -->
  <main class="container my-auto py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-3 p-sm-4 bg-surface">
          <div class="text-center mb-4">
            <div class="icon-circle mx-auto mb-3 bg-primary-custom text-white">
              <i class="bi bi-shield-lock-fill fs-3"></i>
            </div>
            <h2 class="h4 fw-bold mb-1">Iniciar Sesión</h2>
            <p class="text-muted small">Ingresa con tus credenciales institucionales</p>
          </div>

          <div id="loginError" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label small fw-semibold text-uppercase text-muted">Correo Institucional</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="usuario@ucaldas.edu.co" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label for="password" class="form-label small fw-semibold text-uppercase text-muted">Contraseña</label>
                <a href="#" class="small text-decoration-none text-primary-custom" onclick="alert('Mesa de Ayuda TIC: soporte@ucaldas.edu.co')">¿Olvidaste tu clave?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-transparent text-muted"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom text-white w-100 py-2 fw-bold d-flex justify-content-center align-items-center gap-2">
              <span>INGRESAR AL SIA</span>
              <i class="bi bi-arrow-right"></i>
            </button>
          </form>

          <div class="border-top mt-4 pt-3 d-flex justify-content-between small text-muted">
            <span><i class="bi bi-question-circle text-primary-custom me-1"></i> Soporte TIC</span>
            <span>Versión 5.2</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-top bg-white py-3 text-center small text-muted">
    <div class="container">
      © 2026 SIA-UCALDAS · Sistema Integrado Académico · Universidad de Caldas
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
